name: Build and publish Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --run

      - name: Build application
        run: npm run build

      - name: Package installer
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "electron-builder.log"
          npx electron-builder --win nsis --x64 --publish never 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Get-Content $log -Tail 80 | ForEach-Object {
              Write-Output "::error title=electron-builder::$_"
            }
            exit $exitCode
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.1
          name: AutoLogin v0.9.1
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            outputs/AutoLogin-0.9.1-x64.exe
            outputs/AutoLogin-0.9.1-x64.exe.blockmap
            outputs/latest.yml
