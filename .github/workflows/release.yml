name: Build and publish Tauri Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    if: github.repository == 'AptimLvStic/AutoLogin'
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Tauri application and NSIS installer
        run: npm run build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Create updater metadata
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $package.version
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "Tauri NSIS installer was not generated."
          }

          $hash = [Convert]::ToBase64String(
            [Security.Cryptography.SHA512]::Create().ComputeHash(
              [IO.File]::ReadAllBytes($installer.FullName)
            )
          )
          $releaseDate = (Get-Date).ToUniversalTime().ToString("o")
          $latest = @(
            "version: $version"
            "files:"
            "  - url: $($installer.Name)"
            "    sha512: $hash"
            "    size: $($installer.Length)"
            "path: $($installer.Name)"
            "sha512: $hash"
            "releaseDate: '$releaseDate'"
          ) -join "`n"

          New-Item -ItemType Directory -Path outputs -Force | Out-Null
          Copy-Item $installer.FullName (Join-Path outputs $installer.Name) -Force
          Set-Content -Path outputs/latest.yml -Value $latest -Encoding utf8NoBOM
          "TAURI_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAURI_INSTALLER_NAME=$($installer.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.TAURI_RELEASE_VERSION }}
          name: AutoLogin v${{ env.TAURI_RELEASE_VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            outputs/${{ env.TAURI_INSTALLER_NAME }}
            outputs/latest.yml

      - name: Stage CDN update feed
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $site = Join-Path $env:GITHUB_WORKSPACE "updates-site"
          $updates = Join-Path $site "updates"
          New-Item -ItemType Directory -Path $updates -Force | Out-Null
          Copy-Item "outputs/latest.yml" (Join-Path $updates "latest.yml")
          Copy-Item "outputs/$env:TAURI_INSTALLER_NAME" $updates
          New-Item -ItemType File -Path (Join-Path $site ".nojekyll") -Force | Out-Null

      - name: Upload CDN update feed
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: updates-site

  deploy-pages:
    needs: release
    if: github.repository == 'AptimLvStic/AutoLogin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy CDN update feed
        id: deployment
        uses: actions/deploy-pages@v4
