name: Build and publish Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --run

      - name: Install Electron runtime
        run: node node_modules/electron/install.js

      - name: Build application
        run: npm run build

      - name: Package installer
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "electron-builder.log"
          npx electron-builder --win nsis --x64 --publish never 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Get-Content $log -Tail 80 | ForEach-Object {
              Write-Output "::error title=electron-builder::$_"
            }
            exit $exitCode
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.12
          name: AutoLogin v0.9.12
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            outputs/AutoLogin-0.9.12-x64.exe
            outputs/AutoLogin-0.9.12-x64.exe.blockmap
            outputs/latest.yml

      - name: Stage CDN update feed
        shell: pwsh
        run: |
          $site = Join-Path $env:GITHUB_WORKSPACE "updates-site"
          $updates = Join-Path $site "updates"
          New-Item -ItemType Directory -Path $updates -Force | Out-Null
          Copy-Item "outputs/latest.yml" (Join-Path $updates "latest.yml")
          Copy-Item "outputs/AutoLogin-0.9.12-x64.exe" $updates
          Copy-Item "outputs/AutoLogin-0.9.12-x64.exe.blockmap" $updates
          New-Item -ItemType File -Path (Join-Path $site ".nojekyll") -Force | Out-Null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload CDN update feed
        uses: actions/upload-pages-artifact@v3
        with:
          path: updates-site

      - name: Deploy CDN update feed
        id: deployment
        uses: actions/deploy-pages@v4
