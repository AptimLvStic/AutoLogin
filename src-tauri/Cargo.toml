[package]
name = "autologin-tauri"
version = "0.10.4"
description = "AutoLogin desktop application"
authors = ["AutoLogin"]
license = "UNLICENSED"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "autologin_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
dunce = "1.0.5"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = ["devtools"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time"] }
